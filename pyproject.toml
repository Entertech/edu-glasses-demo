[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "looktech-glasses-demo"
version = "0.4.0"
description = "CLI, notebooks, and runnable examples for the Looktech Glasses Python SDK."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "looktech-glasses-sdk[macos,audio,serial]==0.6.0",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "matplotlib", "numpy", "pillow"]
headset = ["sounddevice"]

[project.scripts]
looktech-glasses = "demo_cli:main"

[tool.setuptools]
py-modules = ["demo_cli"]
