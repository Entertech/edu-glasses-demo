[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-glasses-demo"
version = "0.1.0"
description = "CLI and teaching demos using the Looktech EDU glasses SDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "edu-glasses-host[macos,audio,serial] @ git+https://github.com/Entertech/edu-glasses-host.git@3223df70798bd7075a2a642c92f97412fca437c1",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "matplotlib", "numpy", "pillow"]
headset = ["sounddevice"]

[project.scripts]
edu-glasses = "demo_cli:main"

[tool.setuptools]
py-modules = ["demo_cli"]
