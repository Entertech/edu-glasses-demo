[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-glasses-demo"
version = "0.3.0"
description = "CLI and teaching demos using the Looktech EDU glasses SDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "edu-glasses-host[macos,audio,serial]==0.5.0",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "matplotlib", "numpy", "pillow"]
headset = ["sounddevice"]

[project.scripts]
edu-glasses = "demo_cli:main"

[tool.setuptools]
py-modules = ["demo_cli"]
